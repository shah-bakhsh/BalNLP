services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    environment:
      PORT: "8000"
      FRONTEND_URL: http://localhost:3000
    volumes: ["model-cache:/cache/huggingface"]
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  model-cache:
