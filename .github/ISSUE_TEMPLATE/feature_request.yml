{
  "name": "Feature request",
  "description": "Propose a focused improvement.",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Use only non-sensitive text you have permission to share. Report security vulnerabilities privately using SECURITY.md."
      }
    },
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "Problem and intended users"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "expected",
      "attributes": {
        "label": "Proposed behavior and alternatives"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "environment",
      "attributes": {
        "label": "Environment and evidence",
        "description": "Commit, Python/Node/OS, relevant configuration without secrets, and commands/results. State which checks are not run."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
