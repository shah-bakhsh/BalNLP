{
  "name": "Documentation feedback",
  "description": "Report unclear, missing, or incorrect documentation.",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Use only non-sensitive text you have permission to share. Report security vulnerabilities privately using SECURITY.md."
      }
    },
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "Page/path and confusing passage"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "expected",
      "attributes": {
        "label": "Suggested correction"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "environment",
      "attributes": {
        "label": "Environment and evidence",
        "description": "Commit, Python/Node/OS, relevant configuration without secrets, and commands/results. State which checks are not run."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
