{
  "name": "Research or model issue",
  "description": "Report model behavior with reproducible linguistic evidence.",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Use only non-sensitive text you have permission to share. Report security vulnerabilities privately using SECURITY.md."
      }
    },
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "Task, input, predicted output, and expected annotation"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "expected",
      "attributes": {
        "label": "Checkpoint revision, dialect/domain, annotation source, and evaluation protocol"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "environment",
      "attributes": {
        "label": "Environment and evidence",
        "description": "Commit, Python/Node/OS, relevant configuration without secrets, and commands/results. State which checks are not run."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
