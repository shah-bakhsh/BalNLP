name: Model integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BALNLP_RUN_INTEGRATION: "1"
      BALNLP_DEVICE: cpu
      BALNLP_MEMORY_MODE: low
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[inference,dev]'
      - run: pytest -v -m integration
